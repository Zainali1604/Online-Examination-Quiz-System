{% extends 'base.html' %}

{% block title %}Confirm Delete - Online Examination System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center p-4">
                <div class="text-danger display-3 mb-3">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Delete {{ type }}?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ object }}"</strong>? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold shadow-sm">
                            <i class="bi bi-trash me-1"></i> Yes, Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
